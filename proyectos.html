<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conocé nuestros proyectos de instalación de pantallas LED. Casos de éxito y realizaciones profesionales.">
  <meta name="robots" content="index, follow">
  
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="48x48" href="/rtm_logo/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/rtm_logo/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/rtm_logo/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/rtm_logo/apple-touch-icon.png">
  
  <!-- Canonical -->
  <link rel="canonical" href="https://pantallasledrtm.com/proyectos.html">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-dark: #141416;
      --accent: #e84a45;
      --text-light: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
    }
    
    .logo {
      width: 180px;
      margin-bottom: 40px;
    }
    
    .badge {
      display: inline-block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 16px;
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.2;
    }
    
    p {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin-bottom: 40px;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--accent);
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    
    .btn:hover {
      background: #d43d38;
      transform: translateY(-2px);
    }
    
    .links {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }
    
    .links a:hover {
      color: var(--accent);
    }
    
    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html"><img src="rtm_logo/rtmLogo.png" alt="RTM Pantallas LED" class="logo" width="100px"></a>
    
    <h1>Nuestros proyectos</h1>
    <p>
      Estamos preparando una galería con nuestros últimos proyectos e instalaciones.
      Mientras tanto, podés ver una selección en la página principal o contactarnos para conocer casos de éxito.
    </p>
    
    <a href="index.html#proyectos" class="btn">Ver proyectos en el inicio</a>
    
    <div class="links">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="index.html#about">Nosotros</a>
      <a href="index.html#contacto">Contacto</a>
    </div>
  </div>
</body>
</html>
