version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🚀 Iniciando build para AWS Amplify..."
        - echo "📁 Estructura del proyecto:"
        - ls -la
        - echo "📊 Tamaño de assets:"
        - du -sh assets/ || echo "Assets no encontrados"
    build:
      commands:
        - echo "🔧 Ejecutando optimizaciones..."
        - echo "✅ Build completado"
  artifacts:
    baseDirectory: .
    files:
      - '**/*'
  cache:
    paths:
      - assets/**/*
      - node_modules/**/*
