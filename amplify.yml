version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro 7 exige Node >= 22.12.
        - nvm install 22
        - nvm use 22
        - npm --prefix site ci
    build:
      commands:
        # site/public enlaza el sitio actual por symlinks: dist/ sale completo (páginas Astro + el resto tal cual).
        - npm --prefix site run build
        # Ramas de preview (variable RTM_PREVIEW=1 sólo en esa rama de Amplify): que los buscadores no indexen
        # la copia en amplifyapp.com. main no la tiene, así que producción publica su robots.txt normal.
        - 'if [ "$RTM_PREVIEW" = "1" ]; then printf "User-agent: *\nDisallow: /\n" > site/dist/robots.txt; fi'
  artifacts:
    baseDirectory: site/dist
    files:
      - '**/*'
  cache:
    paths:
      - site/node_modules/**/*
  customHeaders:
    - pattern: 'favicon.ico'
      headers:
        - key: 'Content-Type'
          value: 'image/x-icon'
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
    - pattern: '*.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache'
    - pattern: '**/*.css'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.js'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.json'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.png'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
    - pattern: '**/*.jpg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
    - pattern: '**/*.jpeg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
    - pattern: '**/*.webp'
      headers:
        - key: 'Content-Type'
          value: 'image/webp'
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
    - pattern: '**/*.mp4'
      headers:
        - key: 'Content-Type'
          value: 'video/mp4'
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
        - key: 'Accept-Ranges'
          value: 'bytes'
