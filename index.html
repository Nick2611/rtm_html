<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página en Mantenimiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .background-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 100px, rgba(255, 107, 107, 0.03) 100px, rgba(255, 107, 107, 0.03) 200px),
                repeating-linear-gradient(-45deg, transparent, transparent 100px, rgba(201, 42, 42, 0.03) 100px, rgba(201, 42, 42, 0.03) 200px);
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
            max-width: 600px;
        }

        .logo-container {
            margin-bottom: 3rem;
            display: flex;
            justify-content: center;
        }

        .logo-diamond {
            width: 120px;
            height: 120px;
            position: relative;
            transform: rotate(45deg);
            margin: 0 10px;
            animation: float 3s ease-in-out infinite;
        }

        .logo-diamond:nth-child(2) {
            animation-delay: 0.5s;
        }

        .logo-diamond:nth-child(3) {
            animation-delay: 1s;
        }

        .diamond-shape {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff8e8e 0%, #ff6b6b 50%, #c92a2a 50%, #a61e1e 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 10px 30px rgba(201, 42, 42, 0.3);
        }

        @keyframes float {
            0%, 100% {
                transform: rotate(45deg) translateY(0px);
            }
            50% {
                transform: rotate(45deg) translateY(-20px);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ff8e8e 0%, #ff6b6b 50%, #c92a2a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #cccccc;
            margin-bottom: 2rem;
            font-weight: 300;
            line-height: 1.6;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ff6b6b, #c92a2a, transparent);
            margin: 2rem auto;
            border-radius: 2px;
        }

        .info-text {
            font-size: 1rem;
            color: #999999;
            margin-top: 2rem;
            font-weight: 300;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .logo-diamond {
                width: 80px;
                height: 80px;
            }

            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="container">
        <div class="logo-container">
            <div class="logo-diamond">
                <div class="diamond-shape"></div>
            </div>
            <div class="logo-diamond">
                <div class="diamond-shape"></div>
            </div>
            <div class="logo-diamond">
                <div class="diamond-shape"></div>
            </div>
        </div>

        <h1>Página Cerrada</h1>
        <p class="subtitle">por Mantenimiento</p>

        <div class="divider"></div>

        <p class="info-text">
            Estamos realizando mejoras para brindarte una mejor experiencia.<br>
            Por favor, vuelve pronto.
        </p>
    </div>
</body>
</html>
