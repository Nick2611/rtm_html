customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
  
  - pattern: '/favicon.ico'
    headers:
      - key: 'Content-Type'
        value: 'image/x-icon'
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '/logo.png'
    headers:
      - key: 'Content-Type'
        value: 'image/png'
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '*.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
  
  - pattern: '/rtm_logo/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '*.mp4'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '*.jpg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '*.jpeg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  
  - pattern: '*.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

