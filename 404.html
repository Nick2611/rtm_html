<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página no encontrada | RTM Pantallas LED</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="rtm_logo/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="rtm_logo/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="rtm_logo/apple-touch-icon.png">
  
  <!-- Canonical -->
  <link rel="canonical" href="https://pantallasledrtm.com/404.html">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-dark: #141416;
      --accent: #e84a45;
      --text-light: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
    }
    
    .logo {
      width: 180px;
      margin-bottom: 40px;
    }
    
    h1 {
      font-size: 8rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 20px;
    }
    
    h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    
    p {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin-bottom: 40px;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--accent);
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    
    .btn:hover {
      background: #d43d38;
      transform: translateY(-2px);
    }
    
    .links {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }
    
    .links a:hover {
      color: var(--accent);
    }
    
    @media (max-width: 600px) {
      h1 {
        font-size: 5rem;
      }
      
      h2 {
        font-size: 1.4rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/rtm_logo/rtmLogo.png" alt="RTM Pantallas LED" class="logo">
    
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>
      Lo sentimos, la página que buscas no existe o ha sido movida.
      Te invitamos a explorar nuestros productos o volver al inicio.
    </p>
    
    <a href="/" class="btn">Volver al inicio</a>
    
    <div class="links">
      <a href="/productos.html">Productos</a>
      <a href="/#about">Nosotros</a>
      <a href="/#clientes">Clientes</a>
      <a href="/#contacto">Contacto</a>
    </div>
  </div>
</body>
</html>
