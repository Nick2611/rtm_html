<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!--
    Letreros LED se dio de baja el 2026-09-15: el ad group se pausó porque traía consultas por
    cartelería tradicional (letras corpóreas, cajas de luz) aun con la página aclarando que no se
    hace. La URL no se borra —hay enlaces e historial de anuncios apuntando acá— y redirige a
    Pantallas LED, que es el mismo equipo.
    Producción es S3 detrás de CloudFront y NO lee `_redirects`, así que la redirección tiene que
    vivir en el HTML. El script conserva query string y hash para no perder el gclid.
  -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://pantallasledrtm.com/productos/pantallas-led.html">
  <title>Pantallas LED | RTM</title>
  <script>location.replace('/productos/pantallas-led.html' + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/productos/pantallas-led.html">
</head>
<body>
  <p><a href="/productos/pantallas-led.html">Ir a Pantallas LED</a></p>
</body>
</html>
